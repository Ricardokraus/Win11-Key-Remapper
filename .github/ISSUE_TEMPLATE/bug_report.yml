name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [FAQ](https://github.com/Ricardokraus/Win11-Key-Remapper-Acer-Nitrosense/blob/main/docs/FAQ.md) first:
        AutoHotkey, antivirus warnings and the Task Manager limitation are covered there.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings window → About (or Updates).
      placeholder: "0.5.6"
    validations:
      required: true

  - type: input
    id: ahk
    attributes:
      label: How do you run it?
      description: The zip's Win11KeyRemapper.exe, the installer, or the .ahk with your own AutoHotkey (then its version, from Installed apps).
      placeholder: "Win11KeyRemapper.exe from the zip"

  - type: input
    id: laptop
    attributes:
      label: Laptop or keyboard model
      placeholder: Acer Nitro V 16S AI (ANV16S-41)
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver` and copy the version and build.
      placeholder: Windows 11 24H2 (build 26100.xxxx)
    validations:
      required: true

  - type: textarea
    id: codes
    attributes:
      label: Codes shown in the settings window
      description: Tray → Settings… → Change… next to Key → press the key. Write down the codes shown on the right of the key, for each key involved.
      placeholder: NitroSense key · VK FF · SC 175

  - type: textarea
    id: settings
    attributes:
      label: settings.ini
      description: Settings window → Advanced → Open folder. Paste the content of settings.ini.
      render: ini

  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Settings window → Advanced → turn on Write a log, make the problem happen again, then Open and paste the last lines. Check them first, they contain folder paths.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, other keyboard tools running (PowerToys, other AutoHotkey scripts…), antivirus, etc.
